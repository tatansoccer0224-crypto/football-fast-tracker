name: BetClan one-shot list structure probe
on:
  push:
    branches:
      - probe/betclan-listing-structure-20261108
    paths:
      - scripts/probe_betclan_listing_structure_once.py
      - .github/workflows/betclan-listing-structure-probe-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Inspect one BetClan listing, no forecasts or secrets
        run: python -m scripts.probe_betclan_listing_structure_once
